model:
  n_bins: 10
  min_bin_size: 0.05
  base_score: 600
  pdo: 20  # Points to Double Odds

feature_selection:
  k_best: 20
  variance_threshold: 0.01

data_cleaning:
  outlier_threshold: 1.5  # IQR multiplier
  missing_categorical_strategy: 'mode'
  missing_numerical_strategy: 'mean'

training:
  test_size: 0.2
  random_state: 42
  target_column: 'default_flag'  # Assuming this is your target column

paths:
  model_save_path: 'models/scorecard_model.pkl'
  results_save_path: 'results/' 